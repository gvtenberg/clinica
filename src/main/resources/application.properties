spring.application.name=clinica

spring.datasource.url=jdbc:h2:file:./clinicadb;AUTO_SERVER=TRUE
#spring.datasource.url=jdbc:h2:mem:clinicadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.h2.console.enabled=true

#Se for usado data.sql (lido pelo Spring):
#Para ter persistência dos dados: Descomentar a linha abaixo para voltar ao estado inicial do banco, depois comentá-la novamente para persistência. Deixar spring.jpa.hibernate.ddl-auto=update
#spring.sql.init.mode=always

#Se for usado data.sql (lido pelo Spring):
#Fazer arquivo data.sql ser executado após o banco ter sido criado pelo Hibernate
#spring.jpa.defer-datasource-initialization=true

#Se for usado import.sql (lido pelo Hibernate):
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=multi-line

#update = os dados persistem. create-drop = banco criado em toda reinicialização
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
