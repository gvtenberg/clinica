<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head('Entrar')}"></head>

<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">

                <div th:if="${param.error}" class="alert alert-danger">Usuário ou senha inválidos.</div>
                <div th:if="${param.logout}" class="alert alert-success">Você saiu do sistema.</div>

                <div class="card shadow-sm">
                    <h1 class="card-header h5">Informe usuário e senha</h1> <!-- Alterar aqui: excluir linha? -->
                    <div class="card-body">
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuário</label>
                                <input id="username" name="username" class="form-control"
                                       required autofocus autocomplete="login">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input id="password" name="password" type="password" class="form-control"
                                       required autocomplete="senha">
                            </div>
                            <div class="form-check mb-3">
                                <input id="remember-me" name="remember-me" type="checkbox" class="form-check-input">
                                <label for="remember-me" class="form-check-label">Lembrar de mim</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>
</html>
