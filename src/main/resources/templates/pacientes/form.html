<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Cadastro de Pacientes</title>
</head>
<body>
    <h1>Formulário para Cadastro de Pacientes</h1>

    <form th:action="${paciente.id == null} ? @{/pacientes/save} : @{/pacientes/update}" th:object="${paciente}" method="post">
        <div th:if="${#fields.hasAnyErrors()}" class="erro"> <!-- Exibe as mensagens de erro cadastradas nos atributos da Entidade -->
            <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p>
        </div>

        <input type="hidden" th:field="*{id}">
        <label>Nome: <input type="text" th:field="*{nome}" placeholder="Nome" required></label>
        <label>Telefone: <input type="text" th:field="*{telefone}" placeholder="Telefone" required></label>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
