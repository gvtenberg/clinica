<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/mascaras.js" defer></script>
    <!--<title>Cadastro de Pacientes</title> -->
    <title th:text="${paciente.id == null} ? 'Cadastrar Paciente' : 'Editar Paciente'">Paciente</title>
</head>
<body>
    <h1 th:text="${paciente.id == null} ? 'Cadastrar Paciente' : 'Editar Paciente'"></h1>

    <form th:action="${paciente.id == null} ? @{/pacientes/save} : @{/pacientes/update}" th:object="${paciente}" method="post">
        <div th:if="${#fields.hasAnyErrors()}" class="erro"> <!-- Exibe as mensagens de erro cadastradas nos atributos da Entidade -->
            <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p>
        </div>

        <input type="hidden" th:field="*{id}">
        <label>Nome: <input type="text" th:field="*{nome}" placeholder="Nome" required></label>
        <label>Telefone: <input type="text" th:field="*{telefone}" placeholder="(63) 99123-4567" pattern="\(\d{2}\) \d{4,5}-\d{4}" minlength="14" maxlength="15" required></label>
        <input type="submit" th:value="${paciente.id == null} ? 'Cadastrar Paciente' : 'Salvar Alterações'">
    </form>
</body>
</html>
