<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Médicos Cadastrados</title>
</head>
<body>
    <h1>Médicos Cadastrados</h1>

    <a th:href="@{/medicos/form}">
        <button type="button">Cadastrar Médicos</button></a>
    &nbsp;
    <a th:href="@{/consultas/list}">
        <button type="button" class="secundario">Ver Consultas</button></a>
    &nbsp;
    <a th:href="@{/pacientes/list}">
        <button type="button" class="secundario">Ver Pacientes</button></a>

    <!-- Mensagens de erro ou de sucesso enviadas pelo controller como flash attributes para a view -->
    <p th:if="${erro}" th:text="${erro}" class="erro"></p>
    <p th:if="${sucesso}" th:text="${sucesso}" class="sucesso"></p>

    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>CRM</th>
            <th colspan="3">Ações</th>
        </tr>
        </thead>
        <tr th:each="m : ${medicos}">
            <td th:text="${m.nome}"></td>
            <td th:text="${m.crm}"></td>
        <!--<td> <a th:href="@{/medicos/edit/{id}(id=${m.id})}">Editar</a></td> -->
            <td> <a class="editar" th:href="|/medicos/edit/${m.id}|">Editar</a></td>
            <td> <a class="excluir" onclick="return window.confirm('Tem certeza que deseja excluir este registro?')" th:href="|/medicos/remove/${m.id}|">Excluir</a></td>
            <td> <a th:href="|/consultas/medico/${m.id}|">Consultas</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(medicos)}">Nenhum médico cadastrado</p>
</body>
</html>
