<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <!--<title>Cadastro de Médicos</title> -->
    <title th:text="${medico.id == null} ? 'Cadastrar Médico' : 'Editar Médico'">Médico</title>
</head>
<body>
    <h1 th:text="${medico.id == null} ? 'Cadastrar Médico' : 'Editar Médico'"></h1>

    <form th:action="${medico.id == null} ? @{/medicos/save} : @{/medicos/update}" th:object="${medico}" method="post">
        <div th:if="${#fields.hasAnyErrors()}" class="erro"> <!-- Exibe as mensagens de erro cadastradas nos atributos da Entidade -->
            <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p>
        </div>

        <input type="hidden" th:field="*{id}">
        <label>Nome: <input type="text" th:field="*{nome}" placeholder="Nome" required></label>
        <label>CRM: <input type="text" th:field="*{crm}" placeholder="CRM" required></label>
        <input type="submit" th:value="${medico.id == null} ? 'Cadastrar Médico' : 'Salvar Alterações'">
    </form>
</body>
</html>
