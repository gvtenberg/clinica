<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <link rel="stylesheet" href="/css/styles.css">
    <!--/* <title>Consultas</title> */-->
</head>

<body>
<main>
    <h1 th:text="${paciente == null ? 'Consultas do(a) Médico(a) ' + medico.nome : 'Consultas do(a) Paciente ' + paciente.nome}"></h1>

    <table>
        <thead>
            <tr>
                <th>Data e Hora</th>
                <th th:text="${paciente == null ? 'Paciente' : 'Médico'}"></th>
                <th>Observação</th>
                <th>Valor</th>
                <th colspan="2">Ações</th>
            </tr>
        </thead>
        <tr th:each="c : ${consultas}">
            <td th:text="${#temporals.format(c.data, 'dd/MMM/yyyy ''às'' HH:mm')}"></td> <!--/* Formato: 25/Ago/2026 às 19:30 */-->
            <td th:text="${paciente == null ? c.paciente.nome : c.medico.nome}"></td>
            <td th:text="${c.observacao}"></td>
            <td th:text="${c.valor}" class="numero"></td>
            <td> <a class="editar" th:href="|/consultas/edit/${c.id}|">Editar</a></td>
            <td> <a class="excluir" onclick="return window.confirm('Tem certeza que deseja excluir este registro?')" th:href="|/consultas/remove/${c.id}|">Excluir</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(consultas)}">Nenhuma consulta encontrada</p>
</main>
</body>
</html>
