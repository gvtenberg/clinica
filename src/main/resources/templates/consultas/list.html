<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Consultas Cadastradas</title>
</head>
<body>
    <h1>Consultas Cadastradas</h1>

    <a class="botao" th:href="@{/consultas/form}">Cadastrar Consultas</a>
    &nbsp;
    <a class="botao secundario" th:href="@{/medicos/list}">Ver Médicos</a>
    &nbsp;
    <a class="botao secundario" th:href="@{/pacientes/list}">Ver Pacientes</a>

    <!-- Mensagens de erro ou de sucesso enviadas pelo controller como flash attributes para a view -->
    <p th:if="${erro}" th:text="${erro}" class="erro"></p>
    <p th:if="${sucesso}" th:text="${sucesso}" class="sucesso"></p>

   <table>
       <thead>
       <tr>
           <th>Data e Hora</th>
           <th>Paciente</th>
           <th>Médico</th>
           <th>Observação</th>
           <th>Valor</th>
           <th colspan="2">Ações</th>
       </tr>
       </thead>
       <tr th:each="c : ${consultas}">
            <td th:text="${#temporals.format(c.data, 'dd/MMM/yyyy ''às'' HH:mm')}"></td> <!-- 25/Ago/2026 às 19:30 -->
            <td th:text="${c.paciente.nome}"></td> <!-- <a th:href="|/consultas/paciente/${p.id}|">Consultas</a> -->
            <td th:text="${c.medico.nome}"></td> <!-- <a th:href="|/consultas/medico/${m.id}|">Consultas</a> -->
            <td th:text="${c.observacao}"></td>
            <td th:text="${c.valor}" class="numero"></td>
            <td> <a class="editar" th:href="|/consultas/edit/${c.id}|">Editar</a></td>
            <td> <a class="excluir" onclick="return window.confirm('Tem certeza que deseja excluir este registro?')" th:href="|/consultas/remove/${c.id}|">Excluir</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(consultas)}">Nenhuma consulta cadastrada</p>
</body>
</html>
