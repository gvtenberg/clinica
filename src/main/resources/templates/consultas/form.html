<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/styles.css">
    <title>Cadastro de Consultas</title>
</head>
<body>
    <h1>Formulário para Cadastro de Consultas</h1>

    <form th:action="${consulta.id == null} ? @{/consultas/save} : @{/consultas/update}" th:object="${consulta}" method="post">
        <div th:if="${#fields.hasAnyErrors()}" class="erro"> <!-- Exibe as mensagens de erro cadastradas nos atributos da Entidade -->
            <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p>
        </div>

        <input type="hidden" th:field="*{id}">
        <label>Data: <input type="datetime-local" th:field="*{data}" placeholder="Data" required></label> <!-- Não precisa de th:value, pois th:field já gera id, name e value -->
        <label>Médico: <select th:field="*{medico.id}" required>
            <option value="" hidden>Selecione um médico...</option>
            <option th:each="m : ${medicos}" th:value="${m.id}" th:text="${m.nome}"></option>
        </select></label>
        <label>Paciente: <select th:field="*{paciente.id}" required>
            <option value="" hidden>Selecione um paciente...</option>
            <option th:each="p : ${pacientes}" th:value="${p.id}" th:text="${p.nome}"></option>
        </select></label>
        <label>Observação: <input type="text" th:field="*{observacao}" placeholder="Observação"></label>
        <label>Valor: <input type="number" step="0.01" th:field="*{valor}" placeholder="Valor" required></label>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
