<html th:replace="~{fragments/layout :: layout(~{::head},~{::main})}">

<head th:replace="~{fragments/head :: head(${secretario.id == null} ? 'Cadastrar Secretário' : 'Editar Secretário')}"></head>

<body>
<main class="container-md">
    <h1 th:text="${secretario.id == null} ? 'Cadastrar Secretário' : 'Editar Secretário'"></h1>

    <form th:action="${secretario.id == null} ? @{/secretarios/save} : @{/secretarios/update}" th:object="${secretario}" method="post">
        <div th:replace="~{fragments/campos :: erros}"></div>

        <input type="hidden" th:field="*{id}">

        <div class="row">
            <div th:replace="~{fragments/campos :: nome('col-md-6')}"></div>

            <div th:replace="~{fragments/campos :: cpf('col-md-3')}"></div>

            <div th:replace="~{fragments/campos :: nascimento('col-md-3', ${#temporals.createToday().minusYears(18)})}"></div>
        </div>

        <div th:replace="~{fragments/campos :: contato}"></div>

        <div th:replace="~{fragments/campos :: conta}"></div>

        <input class="btn btn-primary" type="submit" th:value="${secretario.id == null} ? 'Cadastrar Secretário' : 'Salvar Alterações'">
    </form>
</main>
</body>
</html>
