<!--/* Campos para os formulários de pacientes, médicos e secretários */-->
<div th:fragment="erros" th:if="${#fields.hasAnyErrors()}" class="alert alert-danger alert-dismissible fade show">
    <p th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></p>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<div th:fragment="nome(largura)" class="mb-3" th:classappend="${largura}">
    <label class="form-label" for="nome">Nome:</label>
    <input class="form-control" id="nome" type="text" th:field="*{nome}" th:errorclass="is-invalid" placeholder="Fulano da Silva" required>
</div>

<div th:fragment="cpf(largura)" class="mb-3" th:classappend="${largura}">
    <label class="form-label" for="cpf">CPF:</label>
    <input class="form-control" id="cpf" type="text" th:field="*{cpf}" th:errorclass="is-invalid" placeholder="123.456.789-00"
           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" minlength="14" maxlength="14" title="Formato esperado: 123.456.789-00" required>
</div>

<!--/* maximo é a data mais recente que o navegador aceita */-->
<div th:fragment="nascimento(largura, maximo)" class="mb-3" th:classappend="${largura}">
    <label class="form-label" for="dataNascimento">Data de nascimento:</label>
    <input class="form-control" id="dataNascimento" type="date" th:field="*{dataNascimento}" th:errorclass="is-invalid"
           th:max="${maximo}" required>
</div>

<div th:fragment="contato" class="row">
    <div class="col-md-8 mb-3">
        <label class="form-label" for="email">E-mail:</label>
        <input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid"
               placeholder="nome@dominio.com" title="Formato esperado: nome@dominio.com" required>
    </div>

    <div class="col-md-4 mb-3">
        <label class="form-label" for="telefone">Telefone:</label>
        <input class="form-control" id="telefone" type="text" th:field="*{telefone}" th:errorclass="is-invalid"
               placeholder="(63) 91234-5678" pattern="\(\d{2}\) \d{4,5}-\d{4}" minlength="14" maxlength="15" required>
    </div>
</div>

<!--/* novo é true no cadastro e false na edição */-->
<div th:fragment="conta" class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label" for="usuario">Usuário:</label>
        <input class="form-control" id="usuario" type="text" th:field="*{usuario.usuario}" th:errorclass="is-invalid"
               maxlength="50" autocomplete="username" th:readonly="*{id != null}" required>
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label" for="senha" th:text="*{id == null} ? 'Senha:' : 'Nova senha (em branco, mantém a atual):'"></label>
        <input class="form-control" id="senha" type="password" th:field="*{usuario.senha}" th:errorclass="is-invalid"
               maxlength="50" autocomplete="new-password" th:required="*{id == null}">
    </div>
</div>
